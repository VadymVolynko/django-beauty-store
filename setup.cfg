[flake8]
max-line-length = 119
# E221: this codebase intentionally aligns consecutive `=` in field/choice
# blocks (models, forms, admin) for readability.
extend-ignore = E221
exclude =
    .venv,
    .git,
    __pycache__,
    migrations,
    staticfiles,
    media,
    locale,
    .idea,
    .agents,
    _bmad
