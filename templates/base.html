{% load static i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Beauty Store{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .user-menu { position: relative; }
        .user-menu__btn {
            display: flex; align-items: center; gap: .45rem;
            background: none; border: none; cursor: pointer;
            color: inherit; font: inherit; padding: .25rem .4rem; border-radius: 8px;
            transition: background .15s;
        }
        .user-menu__btn:hover { background: rgba(200,169,110,.12); }
        .user-avatar {
            width: 30px; height: 30px; border-radius: 50%;
            background: var(--color-accent, #c8a96e); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: .78rem; font-weight: 700; flex-shrink: 0; letter-spacing: 0;
        }
        .user-menu__dropdown {
            display: none; position: absolute; top: calc(100% + 10px); right: 0;
            width: 230px; background: var(--color-surface, #fff);
            border: 1px solid var(--color-border, #e8e0d5); border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,.13); z-index: 1050; overflow: hidden;
        }
        .user-menu__dropdown.open { display: block; }
        .user-menu__header { padding: .9rem 1rem .8rem; }
        .user-menu__name { font-weight: 600; font-size: .88rem; color: var(--color-text, #1a1210); margin-bottom: .15rem; }
        .user-menu__email { font-size: .75rem; color: var(--color-muted, #999); word-break: break-all; }
        .user-menu__divider { height: 1px; background: var(--color-border, #e8e0d5); }
        .user-menu__section { padding: .65rem 1rem; }
        .user-menu__section-label { font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--color-muted, #aaa); margin-bottom: .45rem; }
        .lang-btn {
            background: none; border: 1px solid var(--color-border, #e0d8cc);
            border-radius: 6px; padding: .2rem .65rem; font-size: .78rem;
            cursor: pointer; margin-right: .35rem; color: var(--color-text, #333);
            transition: all .15s; font-family: inherit;
        }
        .lang-btn:hover { border-color: var(--color-accent, #c8a96e); color: var(--color-accent, #c8a96e); }
        .lang-btn--active { background: var(--color-accent, #c8a96e); border-color: var(--color-accent, #c8a96e); color: #fff; }
        .user-menu__link {
            display: block; padding: .65rem 1rem; font-size: .86rem;
            text-decoration: none; color: var(--color-text, #333); transition: background .15s;
        }
        .user-menu__link:hover { background: var(--color-hover, rgba(200,169,110,.08)); }
        .user-menu__link--danger { color: #c0392b; }
        .user-menu__link--danger:hover { background: #fef2f2; }
    </style>
</head>
<body>

{% include "includes/navbar.html" %}

{% if messages %}
<div class="toast-container">
    {% for message in messages %}
        <div class="toast-msg toast-msg--{{ message.tags }}">
            {{ message }}
            <button class="toast-close" type="button" aria-label="{% trans "Close" %}">✕</button>
        </div>
    {% endfor %}
</div>
{% endif %}

{% block content %}{% endblock %}

{% include "includes/footer.html" %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function () {
    var btn = document.getElementById('userMenuBtn');
    var menu = document.getElementById('userMenuDropdown');
    if (!btn || !menu) return;
    btn.addEventListener('click', function (e) {
        e.stopPropagation();
        menu.classList.toggle('open');
    });
    document.addEventListener('click', function () {
        menu.classList.remove('open');
    });
    menu.addEventListener('click', function (e) { e.stopPropagation(); });
})();
</script>
<script>
(function () {
    const root   = document.documentElement;
    const btn    = document.getElementById('themeToggle');
    const sunIcon  = document.getElementById('iconSun');
    const moonIcon = document.getElementById('iconMoon');

    const saved = localStorage.getItem('theme') || 'light';
    apply(saved);

    btn && btn.addEventListener('click', function () {
        const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        apply(next);
        localStorage.setItem('theme', next);
    });

    function apply(theme) {
        root.setAttribute('data-theme', theme);
        if (!sunIcon || !moonIcon) return;
        if (theme === 'dark') {
            sunIcon.style.display  = 'none';
            moonIcon.style.display = 'block';
        } else {
            sunIcon.style.display  = 'block';
            moonIcon.style.display = 'none';
        }
    }
})();
</script>
<script>
(function () {
    function closeToast(toast) {
        if (!toast || toast.classList.contains('toast-msg--closing')) return;
        toast.classList.add('toast-msg--closing');
        toast.addEventListener('transitionend', function () { toast.remove(); }, { once: true });
        setTimeout(function () { toast.remove(); }, 300);
    }

    document.querySelectorAll('.toast-msg').forEach(function (toast) {
        var closeBtn = toast.querySelector('.toast-close');
        closeBtn && closeBtn.addEventListener('click', function () { closeToast(toast); });
        setTimeout(function () { closeToast(toast); }, 5000);
    });
})();
</script>
</body>
</html>
