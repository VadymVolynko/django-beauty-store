{% extends "base.html" %}

{% block title %}Profile | Beauty Store{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 600px;">
    <h2 class="mb-4">My Profile</h2>

    <div class="card shadow-sm">
        <div class="card-body">
            <p><strong>Username:</strong> {{ request.user.username }}</p>
            <p><strong>Email:</strong> {{ request.user.email }}</p>
            <p><strong>Member since:</strong> {{ request.user.date_joined|date:"F j, Y" }}</p>
        </div>
    </div>

    <div class="d-flex gap-3 mt-4 flex-wrap">
        <a href="{% url 'order-history' %}" class="btn-primary-custom">My Orders</a>
        <a href="{% url 'appointment-list' %}" class="btn-primary-custom">My Appointments</a>
        <a href="{% url 'logout' %}" class="btn-outline-custom">Logout</a>
    </div>
</div>
{% endblock %}
