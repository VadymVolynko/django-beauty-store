{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Beauty Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #000; }

        #aurora-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
        }
        #aurora-bg canvas {
            display: block;
            width: 100vw !important;
            height: 100vh !important;
        }

        .login-wrap {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: rgba(10, 10, 20, 0.55);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 2.5rem 2.75rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 60px rgba(0,0,0,0.5);
        }

        .login-brand {
            font-family: 'Playfair Display', serif;
            font-size: .85rem;
            font-weight: 700;
            color: rgba(255,255,255,0.45);
            letter-spacing: .14em;
            text-transform: uppercase;
            text-decoration: none;
            display: block;
            margin-bottom: 1.75rem;
        }

        .login-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            margin: 0 0 .35rem;
        }

        .login-sub {
            color: rgba(255,255,255,0.45);
            font-size: .875rem;
            margin-bottom: 2rem;
        }

        .login-label {
            display: block;
            font-size: .8rem;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            margin-bottom: .35rem;
            letter-spacing: .04em;
        }

        .login-input {
            width: 100%;
            padding: .7rem .95rem;
            border: 1.5px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            background: rgba(255,255,255,0.07);
            color: #fff;
            font-size: .95rem;
            outline: none;
            transition: border-color .2s, background .2s;
            box-sizing: border-box;
        }
        .login-input:focus {
            border-color: rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.12);
        }
        .login-input::placeholder { color: rgba(255,255,255,0.2); }

        .login-btn {
            width: 100%;
            padding: .78rem;
            border: none;
            border-radius: 10px;
            background: #fff;
            color: #1a1a1a;
            font-size: .95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity .2s, transform .15s;
            margin-top: .25rem;
        }
        .login-btn:hover { opacity: .92; transform: translateY(-1px); }

        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: .85rem;
            color: rgba(255,255,255,0.4);
        }
        .login-footer a { color: #c9a96e; font-weight: 600; text-decoration: none; }

        .login-back {
            position: fixed;
            top: 1.5rem;
            left: 1.75rem;
            z-index: 20;
            color: rgba(255,255,255,0.45);
            font-size: .875rem;
            text-decoration: none;
            transition: color .2s;
        }
        .login-back:hover { color: #fff; }

        .alert-aurora {
            background: rgba(192,57,43,0.3);
            border: 1px solid rgba(192,57,43,0.45);
            color: #ffb3ae;
            border-radius: 8px;
            padding: .65rem .9rem;
            font-size: .85rem;
            margin-bottom: 1.25rem;
        }
    </style>
</head>
<body>

<div id="aurora-bg"></div>

<a href="{% url 'home' %}" class="login-back">← Beauty Store</a>

<div class="login-wrap">
    <div class="login-card">
        <a href="{% url 'home' %}" class="login-brand">Beauty Store</a>
        <h1 class="login-title">Welcome back</h1>
        <p class="login-sub">Login to your account</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert-aurora">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="login-label">Username</label>
                <input type="text" name="username" class="login-input"
                       value="{{ request.POST.username }}" autofocus>
            </div>
            <div class="mb-4">
                <label class="login-label">Password</label>
                <input type="password" name="password" class="login-input">
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="login-footer">
            Don't have an account?
            <a href="{% url 'register' %}">Register</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function () {
    var container = document.getElementById('aurora-bg');
    var scene    = new THREE.Scene();
    var camera   = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    var vertShader = [
        'void main() {',
        '  gl_Position = vec4(position, 1.0);',
        '}'
    ].join('\n');

    var fragShader = [
        'uniform float iTime;',
        'uniform vec2  iResolution;',
        '',
        '#define NUM_OCTAVES 3',
        '',
        'float rand(vec2 n) {',
        '  return fract(sin(dot(n, vec2(12.9898, 4.1414))) * 43758.5453);',
        '}',
        '',
        'float noise(vec2 p) {',
        '  vec2 ip = floor(p);',
        '  vec2 u  = fract(p);',
        '  u = u * u * (3.0 - 2.0 * u);',
        '  float res = mix(',
        '    mix(rand(ip), rand(ip + vec2(1.0, 0.0)), u.x),',
        '    mix(rand(ip + vec2(0.0, 1.0)), rand(ip + vec2(1.0, 1.0)), u.x),',
        '    u.y',
        '  );',
        '  return res * res;',
        '}',
        '',
        'float fbm(vec2 x) {',
        '  float v = 0.0;',
        '  float a = 0.3;',
        '  vec2 shift = vec2(100.0);',
        '  mat2 rot = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.5));',
        '  for (int i = 0; i < NUM_OCTAVES; ++i) {',
        '    v += a * noise(x);',
        '    x  = rot * x * 2.0 + shift;',
        '    a *= 0.4;',
        '  }',
        '  return v;',
        '}',
        '',
        'void main() {',
        '  vec2 shake = vec2(sin(iTime * 1.2) * 0.005, cos(iTime * 2.1) * 0.005);',
        '  vec2 p = ((gl_FragCoord.xy + shake * iResolution.xy) - iResolution.xy * 0.5)',
        '           / iResolution.y * mat2(6.0, -4.0, 4.0, 6.0);',
        '  vec2 v;',
        '  vec4 o = vec4(0.0);',
        '  float f = 2.0 + fbm(p + vec2(iTime * 5.0, 0.0)) * 0.5;',
        '',
        '  for (float i = 0.0; i < 35.0; i++) {',
        '    v = p + cos(i * i + (iTime + p.x * 0.08) * 0.025 + i * vec2(13.0, 11.0)) * 3.5',
        '          + vec2(sin(iTime * 3.0 + i) * 0.003, cos(iTime * 3.5 - i) * 0.003);',
        '    float tailNoise = fbm(v + vec2(iTime * 0.5, i)) * 0.3 * (1.0 - (i / 35.0));',
        '    vec4 auroraColors = vec4(',
        '      0.1 + 0.3 * sin(i * 0.2 + iTime * 0.4),',
        '      0.3 + 0.5 * cos(i * 0.3 + iTime * 0.5),',
        '      0.7 + 0.3 * sin(i * 0.4 + iTime * 0.3),',
        '      1.0',
        '    );',
        '    vec4 currentContribution = auroraColors',
        '      * exp(sin(i * i + iTime * 0.8))',
        '      / length(max(v, vec2(v.x * f * 0.015, v.y * 1.5)));',
        '    float thinnessFactor = smoothstep(0.0, 1.0, i / 35.0) * 0.6;',
        '    o += currentContribution * (1.0 + tailNoise * 0.8) * thinnessFactor;',
        '  }',
        '',
        '  o = tanh(pow(o / 100.0, vec4(1.6)));',
        '  gl_FragColor = o * 1.5;',
        '}'
    ].join('\n');

    var material = new THREE.ShaderMaterial({
        uniforms: {
            iTime:       { value: 0.0 },
            iResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
        },
        vertexShader:   vertShader,
        fragmentShader: fragShader
    });

    var mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(mesh);

    function animate() {
        requestAnimationFrame(animate);
        material.uniforms.iTime.value += 0.016;
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', function () {
        renderer.setSize(window.innerWidth, window.innerHeight);
        material.uniforms.iResolution.value.set(window.innerWidth, window.innerHeight);
    });
})();
</script>
</body>
</html>
