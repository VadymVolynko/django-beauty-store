{% load static %}
<!DOCTYPE html>
<html lang="en" data-auth-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check your email | Beauty Store</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body {
            width: 100%; min-height: 100%; margin: 0;
        }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px;
            background: #17130f;
            font-family: Georgia, "Times New Roman", serif;
        }
        .card {
            width: min(100%, 440px);
            background: #f7f3ee;
            border-radius: 14px;
            box-shadow: 0 20px 70px rgba(0,0,0,.34);
            padding: 52px 44px;
            text-align: center;
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 1.2rem;
            line-height: 1;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 400;
            color: #1a1210;
            margin: 0 0 .5rem;
            letter-spacing: .04em;
        }
        .sub {
            color: #b8a090;
            font-size: .85rem;
            letter-spacing: .04em;
            margin-bottom: 1.8rem;
            line-height: 1.6;
        }
        .email-pill {
            display: inline-block;
            background: #ede6db;
            color: #7a5020;
            border-radius: 999px;
            padding: .35rem 1.1rem;
            font-size: .9rem;
            letter-spacing: .04em;
            margin-bottom: 2rem;
        }
        .rule {
            width: 36px;
            height: 1px;
            background: #c8a96e;
            margin: 0 auto 2rem;
        }
        .hint {
            color: #b8a090;
            font-size: .78rem;
            letter-spacing: .05em;
            line-height: 1.6;
        }
        a.btn {
            display: inline-block;
            margin-top: 1.8rem;
            padding: .7rem 2rem;
            border: 1px solid #c8a96e;
            color: #1a1210;
            text-decoration: none;
            font-size: .8rem;
            letter-spacing: .28em;
            text-transform: uppercase;
            transition: background .2s, color .2s;
        }
        a.btn:hover { background: #c8a96e; color: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✉</div>
        <h1>Check your email</h1>
        <div class="rule"></div>
        <div class="email-pill">{{ email }}</div>
        <p class="sub">
            We've sent a verification link to your email.<br>
            Click it to activate your account.
        </p>
        <p class="hint">
            Didn't receive it? Check your spam folder.<br>
            The link expires in 24 hours.
        </p>
        <a href="{% url 'login' %}" class="btn">Back to login</a>
    </div>
</body>
</html>
